[tool.pytest.ini_options]
testpaths = ["tests"]
# A cobertura mínima vale para os módulos de métricas, CFR (b), classificação DORA,
# validação manual, as análises estatísticas e a subamostra da replicação cruzada;
# abaixo de 80% a execução termina com erro.
addopts = "--cov=dora_selection.metrics --cov=dora_selection.rating --cov=dora_selection.cfr --cov=validacao --cov=analise --cov=replicacao --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
