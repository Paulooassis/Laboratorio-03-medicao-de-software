[tool.pytest.ini_options]
testpaths = ["tests"]
# A cobertura mínima vale para os módulos de métricas e classificação DORA;
# abaixo de 80% a execução termina com erro.
addopts = "--cov=dora_selection.metrics --cov=dora_selection.rating --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
