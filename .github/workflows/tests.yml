name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências de teste
        run: python -m pip install -r requirements-dev.txt
      # Os testes são offline: não usam rede nem GITHUB_TOKEN real.
      # --cov-fail-under=80 (pyproject.toml) reprova o job se a cobertura cair.
      - name: Testes e cobertura mínima
        run: python -m pytest
